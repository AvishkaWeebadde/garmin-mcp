# =============================================================================
# stdio hygiene. Read this before changing anything here.
#
# stdout IS the JSON-RPC wire. Any stray byte written to it corrupts the stream,
# and the client's error will be an unhelpful parse failure a long way from the
# cause. The four settings below exist solely to keep stdout clean.
# =============================================================================

# No servlet container, no HTTP listener. The -webmvc / -webflux MCP starters
# would force one; this project depends on spring-ai-starter-mcp-server instead.
spring.main.web-application-type=none

# The Spring banner is printed to stdout. It would be the first thing to corrupt
# the wire, before a single JSON-RPC message was exchanged.
spring.main.banner-mode=off

# Empty console pattern silences the console appender. Logs still exist; they go
# to the file below.
logging.pattern.console=
logging.file.name=./fitmcp.log

# =============================================================================
# MCP server
# =============================================================================

# Defaults to false. Without this the server would try to serve over HTTP.
spring.ai.mcp.server.stdio=true

spring.ai.mcp.server.name=fitmcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.instructions=Personal fitness and activity data. Conforms to fitmcp tool contract v2.

# Only tools are implemented. Resources, prompts and completion are switched off
# so that they do not appear in the advertised capabilities and produce a
# spurious difference against the Go server in Phase 3.
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false

# =============================================================================
# Activity provider
# =============================================================================

# Which ActivityProvider backs the tools. `stub` (default) returns the frozen
# contract fixture; `fit` reads a directory of .FIT files (Strava bulk export or
# raw Garmin). Exactly one provider bean is active, selected here.
#fitmcp.provider=fit

# Directory of .fit / .fit.gz files. Required when fitmcp.provider=fit; a missing
# directory fails startup rather than answering every query with nothing.
#fitmcp.fit.directory=./fit-data
